    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: var(--text);
    padding: 24px 16px 60px;
    min-height: 100vh;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
    text-align: center;
  }
  p.sub {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 24px;
  }
  #grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 480px;
    margin: 0 auto;
  }
  .btn {
    background: var(--accent);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 22px;
    text-align: center;
    cursor: pointer;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 18px;
    position: relative;
    user-select: none;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    min-height: 58px;
  }
  .btn:active { transform: scale(0.98); }
  .btn:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .icon-circle {
    width: 52px;
    height: 52px;
    min-width: 52px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 20px;
  }
  .label {
    font-size: 18px;
    font-weight: 500;
    word-break: break-word;
    flex: 1;
    text-align: center;
    color: #ffffff;
  }
  .remove {
    font-size: 20px;
    color: #ffffff;
    background: none;
    border: none;
    cursor: pointer;
    display: none;
    padding: 6px 8px;
    opacity: 0.85;
  }
  .edit-mode .remove { display: block; }
  .order-btns {
    display: none;
    flex-direction: column;
    gap: 2px;
  }
  .edit-mode .order-btns { display: flex; }
  .order-btns button {
    font-size: 13px;
    line-height: 1;
    color: #ffffff;
    opacity: 0.85;
    background: none;
    border: none;
    cursor: pointer;
    padding: 3px 6px;
  }
  .order-btns button:disabled {
    opacity: 0.25;
    cursor: default;
  }
  .add-card {
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 18px;
    justify-content: center;
  }
  .add-card .label {
    color: var(--muted);
  }
  #toolbar {
    max-width: 480px;
    margin: 0 auto 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  #toolbar button {
    font-size: 15px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    width: 180px;
  }
  #toolbar button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  #modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 16px;
  }
  #modal-backdrop.open { display: flex; }
  #modal {
    background: var(--card);
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 340px;
  }
  #modal h2 { font-size: 16px; margin: 0 0 14px; }
  #modal label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
    margin-top: 12px;
  }
  #modal input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
  }
  #modal .row {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }
  #modal .row button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 14px;
    cursor: pointer;
  }
  #modal .row button.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  #error {
    color: #b3392c;
    font-size: 12px;
    margin-top: 6px;
    display: none;
  }
  #status {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 30px;
  }
</style>
</head>

<div id="grid"></div>

<div id="status"></div>

<div id="toolbar">
  <button id="edit-toggle">Edit</button>
</div>

<div id="modal-backdrop">
  <div id="modal">
    <h2 id="modal-title">Add shortcut</h2>
    <label for="f-name">Name</label>
    <input id="f-name" type="text" placeholder="e.g. Gmail" maxlength="30">
    <label for="f-url">Web address</label>
    <input id="f-url" type="text" placeholder="e.g. gmail.com">
    <div id="error"></div>
    <div class="row">
      <button id="cancel-btn">Cancel</button>
      <button id="save-btn" class="primary">Save</button>
    </div>
  </div>
</div>

<script>
  const grid = document.getElementById('grid');
  const editToggle = document.getElementById('edit-toggle');
  const modalBackdrop = document.getElementById('modal-backdrop');
  const nameInput = document.getElementById('f-name');
  const urlInput = document.getElementById('f-url');
  const errorEl = document.getElementById('error');
  const statusEl = document.getElementById('status');

  const modalTitle = document.getElementById('modal-title');

  const DEFAULTS = [
    { name: 'Compass', url: 'https://mcleodnz.slack.com/docs/T050FEWKDLH/F0788UJ3FAQ' },
    { name: 'Mini Report', url: 'http://mcleod.formstack.com/forms/mini_report_form' },
    { name: 'Buddy Training', url: 'https://mcleod.knack.com/safe-team#new-buddy-training/' },
    { name: 'Competency Assessment', url: 'https://mcleod.knack.com/safe-team#new-competency-assessment3/' },
    { name: 'Site Audit', url: 'http://mcleod.formstack.com/forms/monthly_site_checklist' },
    { name: 'Driver Audit', url: 'http://mcleod.formstack.com/forms/driver_performance_audit' },
    { name: 'Record of Induction', url: 'https://mcleod.knack.com/safe-team#new-induction/' },
    { name: 'SOPs', url: 'https://mcleodnz.slack.com/docs/T050FEWKDLH/F07CRTSKBNV' },
    { name: 'Risk Register', url: 'https://mcleodnz.slack.com/docs/T050FEWKDLH/F07JJSBHUD7' },
    { name: 'PureLink', url: 'https://purelink.nz/' }
  ];

  let shortcuts = [];
  let editMode = false;
  let editingIndex = null;

  function normalizeUrl(raw) {
    let u = raw.trim();
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u;
  }

  function render() {
    grid.innerHTML = '';
    grid.classList.toggle('edit-mode', editMode);

    shortcuts.forEach((s, i) => {
      const card = document.createElement('div');
      card.className = 'btn';

      const orderBtns = document.createElement('div');
      orderBtns.className = 'order-btns';

      const upBtn = document.createElement('button');
      upBtn.textContent = '▲';
      upBtn.setAttribute('aria-label', 'Move ' + s.name + ' up');
      upBtn.disabled = i === 0;
      upBtn.onclick = (e) => {
        e.stopPropagation();
        [shortcuts[i - 1], shortcuts[i]] = [shortcuts[i], shortcuts[i - 1]];
        save();
        render();
      };

      const downBtn = document.createElement('button');
      downBtn.textContent = '▼';
      downBtn.setAttribute('aria-label', 'Move ' + s.name + ' down');
      downBtn.disabled = i === shortcuts.length - 1;
      downBtn.onclick = (e) => {
        e.stopPropagation();
        [shortcuts[i + 1], shortcuts[i]] = [shortcuts[i], shortcuts[i + 1]];
        save();
        render();
      };

      orderBtns.appendChild(upBtn);
      orderBtns.appendChild(downBtn);

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = s.name;

      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove';
      removeBtn.textContent = '✕';
      removeBtn.setAttribute('aria-label', 'Remove ' + s.name);
      removeBtn.onclick = (e) => {
        e.stopPropagation();
        shortcuts.splice(i, 1);
        save();
        render();
      };

      card.appendChild(orderBtns);
      card.appendChild(label);
      card.appendChild(removeBtn);

      card.onclick = () => {
        if (editMode) {
          openModal(i);
        } else {
          window.open(s.url, '_blank');
        }
      };

      grid.appendChild(card);
    });

    if (editMode) {
      const addCard = document.createElement('div');
      addCard.className = 'btn add-card';
      addCard.innerHTML = '<div class="label">+ Add shortcut</div>';
      addCard.onclick = () => openModal(null);
      grid.appendChild(addCard);
    }
  }

  function openModal(index) {
    editingIndex = index;
    if (index === null) {
      modalTitle.textContent = 'Add shortcut';
      nameInput.value = '';
      urlInput.value = '';
    } else {
      modalTitle.textContent = 'Edit shortcut';
      nameInput.value = shortcuts[index].name;
      urlInput.value = shortcuts[index].url;
    }
    errorEl.style.display = 'none';
    modalBackdrop.classList.add('open');
    nameInput.focus();
  }

  function closeModal() {
    modalBackdrop.classList.remove('open');
    editingIndex = null;
  }

  document.getElementById('cancel-btn').onclick = closeModal;
  modalBackdrop.onclick = (e) => { if (e.target === modalBackdrop) closeModal(); };

  document.getElementById('save-btn').onclick = () => {
    const name = nameInput.value.trim();
    const rawUrl = urlInput.value.trim();
    if (!name || !rawUrl) {
      errorEl.textContent = 'Enter a name and a web address.';
      errorEl.style.display = 'block';
      return;
    }
    const entry = { name, url: normalizeUrl(rawUrl) };
    if (editingIndex === null) {
      shortcuts.push(entry);
    } else {
      shortcuts[editingIndex] = entry;
    }
    save();
    render();
    closeModal();
  };

  editToggle.onclick = () => {
    editMode = !editMode;
    editToggle.classList.toggle('active', editMode);
    editToggle.textContent = editMode ? 'Done' : 'Edit';
    render();
  };

  function save() {
    try {
      localStorage.setItem('shortcuts', JSON.stringify(shortcuts));
      statusEl.textContent = '';
    } catch (err) {
      statusEl.textContent = 'Could not save changes.';
    }
  }

  function load() {
    try {
      const raw = localStorage.getItem('shortcuts');
      shortcuts = raw ? JSON.parse(raw) : DEFAULTS;
    } catch (err) {
      shortcuts = DEFAULTS;
    }
    render();
  }

  load();
</script>

</body>
</html>
