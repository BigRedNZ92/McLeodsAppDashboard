    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: var(--text);
    padding: 24px 16px 60px;
    min-height: 100vh;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
    text-align: center;
  }
  p.sub {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 24px;
  }
  #grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 480px;
    margin: 0 auto;
  }
  .btn {
    background: var(--accent);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 22px;
    text-align: center;
    cursor: pointer;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 18px;
    position: relative;
    user-select: none;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    min-height: 58px;
  }
  .btn:active { transform: scale(0.98); }
  .btn:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .icon-circle {
    width: 52px;
    height: 52px;
    min-width: 52px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 20px;
  }
  .label {
    font-size: 18px;
    font-weight: 500;
    word-break: break-word;
    flex: 1;
    text-align: center;
    color: #ffffff;
  }
  .remove {
    font-size: 20px;
    color: #ffffff;
    background: none;
    border: none;
    cursor: pointer;
    display: none;
    padding: 6px 8px;
    opacity: 0.85;
  }
  .edit-mode .remove { display: block; }
  .order-btns {
    display: none;
    flex-direction: column;
    gap: 2px;
  }
  .edit-mode .order-btns { display: flex; }
  .order-btns button {
    font-size: 13px;
    line-height: 1;
    color: #ffffff;
    opacity: 0.85;
    background: none;
    border: none;
    cursor: pointer;
    padding: 3px 6px;
  }
  .order-btns button:disabled {
    opacity: 0.25;
    cursor: default;
  }
  .add-card {
    border: 1px dashed var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 18px;
    justify-content: center;
  }
  .add-card .label {
    color: #ffffff;
  }
  #toolbar {
    max-width: 480px;
    margin: 70px auto 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  #toolbar button {
    font-size: 15px;
    font-weight: 500;
    padding: 14px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: #000000;
    color: #ffffff;
    cursor: pointer;
    width: 64px;
    height: 64px;
  }
  #toolbar button.active {
    background: var(--accent);
    color: #fff;
  }
  #modal-backdrop, #confirm-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 16px;
  }
  #modal-backdrop.open, #confirm-backdrop.open { display: flex; }
  #modal, .modal-box {
    background: var(--card);
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 340px;
  }
  .modal-box h2 { font-size: 16px; margin: 0 0 14px; }
  #confirm-title { text-align: center; }
  .modal-box label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
    margin-top: 12px;
  }
  #modal input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
  }
  .modal-box .row {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }
  .modal-box .row button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 14px;
    cursor: pointer;
  }
  .modal-box .row button.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  #error {
    color: #b3392c;
    font-size: 12px;
    margin-top: 6px;
    display: none;
  }
  #status {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 30px;
  }
</style>

      <button id="confirm-cancel-btn">Cancel</button>
      <button id="confirm-remove-btn" class="primary">Remove</button>
    </div>
  </div>
</div>

<script>
  const grid = document.getElementById('grid');
  const editToggle = document.getElementById('edit-toggle');
  const modalBackdrop = document.getElementById('modal-backdrop');
  const nameInput = document.getElementById('f-name');
  const urlInput = document.getElementById('f-url');
  const errorEl = document.getElementById('error');
  const statusEl = document.getElementById('status');

  const modalTitle = document.getElementById('modal-title');

  const confirmBackdrop = document.getElementById('confirm-backdrop');
  const confirmTitle = document.getElementById('confirm-title');
  const confirmCancelBtn = document.getElementById('confirm-cancel-btn');
  const confirmRemoveBtn = document.getElementById('confirm-remove-btn');
  let pendingRemoveIndex = null;

  confirmCancelBtn.onclick = () => {
    pendingRemoveIndex = null;
    confirmBackdrop.classList.remove('open');
  };

  confirmBackdrop.onclick = (e) => {
    if (e.target === confirmBackdrop) {
      pendingRemoveIndex = null;
      confirmBackdrop.classList.remove('open');
    }
  };

  confirmRemoveBtn.onclick = () => {
    if (pendingRemoveIndex !== null) {
      shortcuts.splice(pendingRemoveIndex, 1);
      save();
      render();
    }
    pendingRemoveIndex = null;
    confirmBackdrop.classList.remove('open');
  };

  const DEFAULTS = [
    { name: 'Compass', url: 'https://mcleodnz.slack.com/docs/T050FEWKDLH/F0788UJ3FAQ' },
    { name: 'Mini Report', url: 'http://mcleod.formstack.com/forms/mini_report_form' },
    { name: 'Buddy Training', url: 'https://mcleod.knack.com/safe-team#new-buddy-training/' },
    { name: 'Competency Assessment', url: 'https://mcleod.knack.com/safe-team#new-competency-assessment3/' },
    { name: 'Site Audit', url: 'http://mcleod.formstack.com/forms/monthly_site_checklist' },
    { name: 'Driver Audit', url: 'http://mcleod.formstack.com/forms/driver_performance_audit' },
    { name: 'Record of Induction', url: 'https://mcleod.knack.com/safe-team#new-induction/' },
    { name: 'SOPs', url: 'https://mcleodnz.slack.com/docs/T050FEWKDLH/F07CRTSKBNV' },
    { name: 'Risk Register', url: 'https://mcleodnz.slack.com/docs/T050FEWKDLH/F07JJSBHUD7' }
  ];

  let shortcuts = [];
  let editMode = false;
  let editingIndex = null;

  function normalizeUrl(raw) {
    let u = raw.trim();
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u;
  }

  function render() {
    grid.innerHTML = '';
    grid.classList.toggle('edit-mode', editMode);

    shortcuts.forEach((s, i) => {
      const card = document.createElement('div');
      card.className = 'btn';

      const orderBtns = document.createElement('div');
      orderBtns.className = 'order-btns';

      const upBtn = document.createElement('button');
      upBtn.textContent = '▲';
      upBtn.setAttribute('aria-label', 'Move ' + s.name + ' up');
      upBtn.disabled = i === 0;
      upBtn.onclick = (e) => {
        e.stopPropagation();
        [shortcuts[i - 1], shortcuts[i]] = [shortcuts[i], shortcuts[i - 1]];
        save();
        render();
      };

      const downBtn = document.createElement('button');
      downBtn.textContent = '▼';
      downBtn.setAttribute('aria-label', 'Move ' + s.name + ' down');
      downBtn.disabled = i === shortcuts.length - 1;
      downBtn.onclick = (e) => {
        e.stopPropagation();
        [shortcuts[i + 1], shortcuts[i]] = [shortcuts[i], shortcuts[i + 1]];
        save();
        render();
      };

      orderBtns.appendChild(upBtn);
      orderBtns.appendChild(downBtn);

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = s.name;

      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove';
      removeBtn.textContent = '✕';
      removeBtn.setAttribute('aria-label', 'Remove ' + s.name);
      removeBtn.onclick = (e) => {
        e.stopPropagation();
        pendingRemoveIndex = i;
        confirmTitle.textContent = 'Remove "' + s.name + '"?';
        confirmBackdrop.classList.add('open');
      };

      card.appendChild(orderBtns);
      card.appendChild(label);
      card.appendChild(removeBtn);

      card.onclick = () => {
        if (editMode) {
          openModal(i);
        } else {
          window.open(s.url, '_blank');
        }
      };

      grid.appendChild(card);
    });

    if (editMode) {
      const addCard = document.createElement('div');
      addCard.className = 'btn add-card';
      addCard.innerHTML = '<div class="label">+ Add shortcut</div>';
      addCard.onclick = () => openModal(null);
      grid.appendChild(addCard);
    }
  }

  function openModal(index) {
    editingIndex = index;
    if (index === null) {
      modalTitle.textContent = 'Add shortcut';
      nameInput.value = '';
      urlInput.value = '';
    } else {
      modalTitle.textContent = 'Edit shortcut';
      nameInput.value = shortcuts[index].name;
      urlInput.value = shortcuts[index].url;
    }
    errorEl.style.display = 'none';
    modalBackdrop.classList.add('open');
    nameInput.focus();
  }

  function closeModal() {
    modalBackdrop.classList.remove('open');
    editingIndex = null;
  }

  document.getElementById('cancel-btn').onclick = closeModal;
  modalBackdrop.onclick = (e) => { if (e.target === modalBackdrop) closeModal(); };

  document.getElementById('save-btn').onclick = () => {
    const name = nameInput.value.trim();
    const rawUrl = urlInput.value.trim();
    if (!name || !rawUrl) {
      errorEl.textContent = 'Enter a name and a web address.';
      errorEl.style.display = 'block';
      return;
    }
    const entry = { name, url: normalizeUrl(rawUrl) };
    if (editingIndex === null) {
      shortcuts.push(entry);
    } else {
      shortcuts[editingIndex] = entry;
    }
    save();
    render();
    closeModal();
  };

  editToggle.onclick = () => {
    editMode = !editMode;
    editToggle.classList.toggle('active', editMode);
    editToggle.textContent = editMode ? 'Done' : 'Edit';
    render();
  };

  function save() {
    try {
      localStorage.setItem('shortcuts', JSON.stringify(shortcuts));
      statusEl.textContent = '';
    } catch (err) {
      statusEl.textContent = 'Could not save changes.';
    }
  }

  function load() {
    try {
      const raw = localStorage.getItem('shortcuts');
      shortcuts = raw ? JSON.parse(raw) : DEFAULTS;
    } catch (err) {
      shortcuts = DEFAULTS;
    }
    render();
  }

  load();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
